<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xiperi Xa Tsonga - AI Tutor</title>
<style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;}
    body{background:linear-gradient(135deg,#0A1A2F,#FF8C00);min-height:100vh;padding:20px;color:#fff;}
   .container{max-width:800px;margin:auto;background:white;color:#333;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.2);}
   .header{text-align:center;margin-bottom:20px;}
   .header h1{color:#0A1A2F;font-size:24px;}
   .header p{color:#666;}
   .chat-box{height:400px;overflow-y:auto;border:2px solid #FF8C00;border-radius:12px;padding:15px;background:#f9f9f9;margin-bottom:15px;}
   .msg{margin:10px 0;padding:12px;border-radius:10px;max-width:80%;}
   .user-msg{background:#FF8C00;color:white;margin-left:auto;text-align:right;}
   .ai-msg{background:#e3f2fd;color:#0A1A2F;}
   .input-area{display:flex;gap:10px;}
   .input-area input{flex:1;padding:14px;border:2px solid #ddd;border-radius:10px;font-size:15px;}
   .btn{padding:14px 20px;background:#FF8C00;color:white;border:none;border-radius:10px;font-weight:bold;cursor:pointer;}
   .btn:hover{background:#e67e00;}
   .lesson-box{background:#fff3e0;padding:15px;border-radius:12px;margin:15px 0;border-left:4px solid #FF8C00;}
   .speak-btn{background:#25D366;font-size:12px;padding:6px 10px;margin-left:10px;}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🗣️ Xiperi Xa Tsonga</h1>
        <p>Learn Tsonga with AI. Ask anything in English, get answers in Tsonga + English</p>
    </div>

    <div class="lesson-box">
        <b>Today's Lesson:</b> Greetings <br>
        <b>Hello</b> = Avuxeni <button class="speak-btn" onclick="speak('Avuxeni')">🔊</button><br>
        <b>How are you?</b> = U njhani? <button class="speak-btn" onclick="speak('U njhani?')">🔊</button>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="msg ai-msg">Avuxeni! 👋 I'm your Tsonga AI Tutor. Ask me "How do I say I love you in Tsonga?"</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type in English: e.g 'How to say thank you'">
        <button class="btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyChBS3AUnlaOYjUTvGzdS7jt_8NfWTbeLc",
  authDomain: "tsonga-translation-app.firebaseapp.com",
  databaseURL: "https://tsonga-translation-app-default-rtdb.firebaseio.com/",
  projectId: "tsonga-translation-app",
  storageBucket: "tsonga-translation-app.firebasestorage.app",
  messagingSenderId: "79166246549",
  appId: "1:79166246549:web:443e35601f68051773159c",
  measurementId: "G-1GMWKSXHEF"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getDatabase(app);

// IMPORTANT: Get your FREE Gemini API key from https://aistudio.google.com/app/apikey
const GEMINI_API_KEY = "PASTE_YOUR_GEMINI_API_KEY_HERE";

const chatBox = document.getElementById('chatBox');

window.sendMessage = async () => {
    const input = document.getElementById('userInput');
    const question = input.value.trim();
    if(!question) return;

    addMessage(question, 'user-msg');
    input.value = '';
    addMessage('Ndzi nga ku pfuna... Thinking 🤔', 'ai-msg');

    // Save to Firebase for progress tracking
    push(ref(db, 'learning-log'), {
        question: question,
        timestamp: new Date().toISOString()
    });

    try {
        const prompt = `You are a Tsonga language teacher. The user is a beginner who wants to learn Xitsonga.
        User asked: "${question}"
        Respond with:
        1. Tsonga Translation
        2. English Explanation
        3. Example sentence in Tsonga with English translation
        4. Pronunciation tip
        Keep it friendly and short.`;

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                contents: [{parts: [{text: prompt}]}]
            })
        });
        const data = await res.json();
        const aiText = data.candidates[0].content.parts[0].text;

        // Remove "thinking" message and add real answer
        chatBox.lastChild.remove();
        addMessage(aiText, 'ai-msg');

    } catch(err) {
        chatBox.lastChild.remove();
        addMessage("Error: " + err.message + ". Did you add your Gemini API key?", 'ai-msg');
    }
}

function addMessage(text, className) {
    const div = document.createElement('div');
    div.className = `msg ${className}`;
    div.innerHTML = text.replace(/\n/g,'<br>');
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

window.speak = (text) => {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-ZA'; // Closest available. Real Tsonga voice coming soon
    speechSynthesis.speak(utterance);
}

// Enter key to send
document.getElementById('userInput').addEventListener('keypress', (e) => {
    if(e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
